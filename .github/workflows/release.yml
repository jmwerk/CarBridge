# Builds the release-signed APK when a v* tag is pushed and publishes it as a GitHub release.
# Needs repository secrets CARBRIDGE_KEYSTORE (base64 .jks), CARBRIDGE_STORE_PASSWORD,
# CARBRIDGE_KEY_ALIAS and CARBRIDGE_KEY_PASSWORD; scripts/release.sh hands off here when they exist.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_CERT_SHA256: a4689360a91a49b16fa7b150dcfc6e2b89211acdb963b55f1b15704ada43cc7f
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore release key
        env:
          CARBRIDGE_KEYSTORE: ${{ secrets.CARBRIDGE_KEYSTORE }}
        run: |
          [ -n "$CARBRIDGE_KEYSTORE" ] || { echo "CARBRIDGE_KEYSTORE secret missing" >&2; exit 1; }
          echo "$CARBRIDGE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          ORG_GRADLE_PROJECT_CARBRIDGE_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_CARBRIDGE_STORE_PASSWORD: ${{ secrets.CARBRIDGE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_CARBRIDGE_KEY_ALIAS: ${{ secrets.CARBRIDGE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_CARBRIDGE_KEY_PASSWORD: ${{ secrets.CARBRIDGE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :patcher:assembleRelease

      # Obtainium can't update across signing keys, so never ship a debug-signed fallback
      - name: Verify signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          cert=$("$apksigner" verify --print-certs patcher/build/outputs/apk/release/patcher-release.apk \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          [ "$cert" = "$RELEASE_CERT_SHA256" ] || { echo "APK not signed with the release key ($cert)" >&2; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="CarBridge-$version.apk"
          cp patcher/build/outputs/apk/release/patcher-release.apk "$out"
          gh release create "$GITHUB_REF_NAME" "$out" --title "CarBridge $version" --generate-notes

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
